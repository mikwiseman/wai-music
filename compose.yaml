services:
  wai-music:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/wai-music/music.env
    volumes:
      - /var/lib/wai-music:/var/lib/wai-music
    expose:
      - "8000"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - wai-music
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
