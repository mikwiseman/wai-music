[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wai-music"
version = "0.1.0"
description = "Universal MCP server for music discovery, context and playlists"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Mik Wiseman" },
]
keywords = ["mcp", "music", "spotify", "musicbrainz"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "mcp[cli]>=1.12,<2",
  "httpx>=0.28.1,<0.29",
  "spotipy>=2.26,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "structlog>=25.5,<26",
  "cryptography>=46.0.7,<47",
  "sentry-sdk[httpx,mcp,starlette]>=2.58,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.20,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "pytest-vcr>=1.0,<2",
  "ruff>=0.15,<0.16",
]

[project.scripts]
wai-music = "wai_music.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wai_music"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "ASYNC",
  "C4",
  "RUF",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
pretty = true
mypy_path = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["spotipy", "spotipy.*"]
ignore_missing_imports = true
