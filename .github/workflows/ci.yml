name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/
      - run: uv run pytest tests/ -v --cov=src/wai_music --cov-report=term-missing
      - run: uv build
      - run: uv venv .venv-wheel --python ${{ matrix.python-version }}
      - run: uv pip install --python .venv-wheel/bin/python dist/*.whl
      - run: .venv-wheel/bin/python -c "from wai_music.server import main; from wai_music.models import Entity"
      - run: .venv-wheel/bin/wai-music --help
      - run: uv venv .venv-sdist --python ${{ matrix.python-version }}
      - run: uv pip install --python .venv-sdist/bin/python dist/*.tar.gz
      - run: .venv-sdist/bin/python -c "from wai_music.server import main; from wai_music.models import Entity"
